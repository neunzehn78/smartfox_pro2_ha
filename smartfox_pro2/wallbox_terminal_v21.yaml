title: Smartfox Pro Charger
icon: mdi:ev-station
views:
  - title: Smartfox Pro Charger
    path: wallbox
    icon: mdi:ev-station
    background:
      color: '#0a0a0a'
    cards:
      - type: vertical-stack
        cards:
          - type: custom:stack-in-card
            mode: horizontal
            card_mod:
              style: |
                ha-card {
                  background: #0d0d0d !important;
                  border: 1px solid #2a2a2a !important;
                  border-radius: 16px !important;
                  overflow: hidden !important;
                }
            cards:
              - type: custom:button-card
                entity: sensor.wallbox_status
                show_name: true
                show_state: true
                show_icon: true
                icon: mdi:ev-station
                name: STATUS
                styles:
                  card:
                    - background: transparent
                    - border: none
                    - border-right: 1px solid "#2a2a2a"
                    - border-radius: 0px
                    - padding: 14px 16px
                  name:
                    - font-size: 10px
                    - letter-spacing: 0.12em
                    - color: '#888'
                    - text-transform: uppercase
                    - margin-bottom: 2px
                  state:
                    - font-size: 16px
                    - font-weight: 700
                    - letter-spacing: 0.05em
                    - text-transform: uppercase
                  icon:
                    - width: 22px
                    - color: |-
                        [[[ if (entity.state === 'charging') return '#00e070';
                            if (entity.state === 'available') return '#4a9eff';
                            if (entity.state === 'occupied') return '#cc8800';
                            return '#333'; ]]]
                  img_cell:
                    - margin-right: 10px
                state:
                  - value: charging
                    styles:
                      state:
                        - color: '#00e070'
                  - value: available
                    styles:
                      state:
                        - color: '#4a9eff'
                  - value: occupied
                    styles:
                      state:
                        - color: '#cc8800'
                  - operator: default
                    styles:
                      state:
                        - color: '#888'
              - type: custom:button-card
                entity: sensor.wallbox_lademodus
                show_name: true
                show_state: true
                show_icon: true
                icon: mdi:tune-variant
                name: MODUS
                styles:
                  card:
                    - background: transparent
                    - border: none
                    - border-radius: 0px
                    - padding: 14px 16px
                  name:
                    - font-size: 10px
                    - letter-spacing: 0.12em
                    - color: '#888'
                    - text-transform: uppercase
                    - margin-bottom: 2px
                  state:
                    - font-size: 16px
                    - font-weight: 700
                  icon:
                    - width: 22px
                    - color: >-
                        [[[ if
                        (['surplus','surplus_plus'].includes(entity.state))
                        return '#00803a';
                            if (entity.state === 'manual') return '#4a9eff';
                            return '#333'; ]]]
                  img_cell:
                    - margin-right: 10px
                state:
                  - value: surplus
                    styles:
                      state:
                        - color: '#00803a'
                  - value: surplus_plus
                    styles:
                      state:
                        - color: '#00e070'
                  - value: manual
                    styles:
                      state:
                        - color: '#4a9eff'
                  - value: 'off'
                    styles:
                      state:
                        - color: '#888'
                  - operator: default
                    styles:
                      state:
                        - color: '#555'
          - type: custom:button-card
            entity: switch.wallbox_lademodus_manuell
            show_name: true
            show_state: true
            show_icon: true
            name: LADEMODUS
            tap_action:
              action: toggle
            styles:
              card:
                - background: '#0d0d0d'
                - border: 1px solid "#2a2a2a"
                - border-radius: 16px
                - padding: 14px 16px
                - cursor: pointer
                - text-align: center
              grid:
                - grid-template-areas: '"i" "n" "s"'
                - grid-template-columns: auto
                - justify-items: center
              name:
                - font-size: 10px
                - letter-spacing: 0.12em
                - color: '#888'
                - text-transform: uppercase
                - justify-self: center
                - margin-bottom: 4px
              state:
                - font-size: 16px
                - font-weight: 700
                - justify-self: center
              icon:
                - width: 22px
                - color: >-
                    [[[ return entity.state === 'on' ? '#4a9eff' : '#00803a';
                    ]]]
              img_cell:
                - margin-right: 0px
                - margin-bottom: 6px
            state_display: >-
              [[[ return entity.state === 'on' ? 'Manuell (M)' : 'Überschuss
              (A)'; ]]]
            state:
              - value: 'on'
                styles:
                  state:
                    - color: '#4a9eff'
              - value: 'off'
                styles:
                  state:
                    - color: '#00803a'
          - type: custom:button-card
            entity: sensor.wallbox_ladeleistung
            show_name: true
            show_state: true
            show_icon: false
            name: LADELEISTUNG
            styles:
              card:
                - background: '#0d0d0d'
                - border: 1px solid "#2a2a2a"
                - border-radius: 16px
                - padding: 24px 20px 20px
                - text-align: center
              name:
                - font-size: 10px
                - letter-spacing: 0.12em
                - color: '#888'
                - text-transform: uppercase
                - margin-bottom: 8px
                - display: block
              state:
                - font-size: 72px
                - font-weight: 700
                - color: white
                - letter-spacing: '-0.02em'
                - line-height: 1
            state_display: |-
              [[[
                const w = parseFloat(entity.state) || 0;
                const kw = (w / 1000).toFixed(2);
                return `<span style="color:white">${kw}</span><span style="font-size:24px;color:white;font-weight:400;margin-left:6px">kW</span>`;
              ]]]
          - type: custom:stack-in-card
            mode: horizontal
            card_mod:
              style: |
                ha-card {
                  background: #0d0d0d !important;
                  border: 1px solid #2a2a2a !important;
                  border-radius: 16px !important;
                  overflow: hidden !important;
                }
            cards:
              - type: custom:button-card
                entity: sensor.wallbox_letzte_ladesession
                show_name: true
                show_state: true
                show_icon: false
                name: LETZTE SESSION
                styles:
                  card:
                    - background: transparent
                    - border: none
                    - border-right: 1px solid "#2a2a2a"
                    - border-radius: 0px
                    - padding: 16px
                    - text-align: center
                  name:
                    - font-size: 10px
                    - letter-spacing: 0.12em
                    - color: '#888'
                    - text-transform: uppercase
                    - margin-bottom: 6px
                  state:
                    - font-size: 28px
                    - font-weight: 700
                    - color: '#ddd'
              - type: custom:button-card
                entity: sensor.wallbox_ladeenergie_heute
                show_name: true
                show_state: true
                show_icon: false
                name: HEUTE
                styles:
                  card:
                    - background: transparent
                    - border: none
                    - border-radius: 0px
                    - padding: 16px
                    - text-align: center
                  name:
                    - font-size: 10px
                    - letter-spacing: 0.12em
                    - color: '#888'
                    - text-transform: uppercase
                    - margin-bottom: 6px
                  state:
                    - font-size: 28px
                    - font-weight: 700
                    - color: '#ddd'

          # 5 — Skoda Enyaq Ladestand
          - type: custom:button-card
            entity: sensor.skoda_enyaq_batteriestand
            show_name: true
            show_state: true
            show_icon: true
            name: ENYAQ LADESTAND
            icon: mdi:car-electric
            styles:
              card:
                - background: "#0d0d0d"
                - border: 1px solid "#2a2a2a"
                - border-radius: 16px
                - padding: 14px 16px
                - text-align: center
              grid:
                - grid-template-areas: '"i" "n" "s"'
                - grid-template-columns: 1fr
                - justify-items: center
                - align-items: center
              name:
                - font-size: 10px
                - letter-spacing: 0.12em
                - color: '#888'
                - text-transform: uppercase
                - justify-self: center
                - margin-top: 6px
                - margin-bottom: 4px
              state:
                - font-size: 36px
                - font-weight: 700
                - justify-self: center
              icon:
                - width: 28px
                - color: >-
                    [[[ const soc = parseFloat(entity.state) || 0;
                        if (soc >= 80) return '#00e070';
                        if (soc >= 50) return '#4a9eff';
                        if (soc >= 20) return '#cc8800';
                        return '#cc3333'; ]]]
              img_cell:
                - justify-self: center
                - margin: 0 auto
            state_display: >-
              [[[ const soc = parseFloat(entity.state) || 0;
                  const col = soc >= 80 ? '#00e070' : soc >= 50 ? '#4a9eff' : soc >= 20 ? '#cc8800' : '#cc3333';
                  return `<span style="color:${col}">${soc}</span><span style="font-size:18px;color:#555;margin-left:4px">%</span>`;
              ]]]
      - type: vertical-stack
        cards:
          - type: custom:stack-in-card
            mode: horizontal
            card_mod:
              style: |
                ha-card {
                  background: #0d0d0d !important;
                  border: 1px solid #2a2a2a !important;
                  border-radius: 16px !important;
                  overflow: hidden !important;
                }
            cards:
              - type: custom:button-card
                entity: sensor.wallbox_regelstrom
                show_name: true
                show_state: true
                show_icon: false
                name: REGELSTROM
                styles:
                  card:
                    - background: transparent
                    - border: none
                    - border-right: 1px solid "#2a2a2a"
                    - border-radius: 0px
                    - padding: 14px 10px
                    - text-align: center
                  name:
                    - font-size: 10px
                    - letter-spacing: 0.12em
                    - color: '#888'
                    - text-transform: uppercase
                    - margin-bottom: 4px
                  state:
                    - font-size: 20px
                    - font-weight: 700
                    - color: >-
                        [[[ return (parseFloat(entity.state) || 0) > 0 ?
                        '#00803a' : '#555'; ]]]
              - type: custom:button-card
                entity: sensor.wallbox_stromlimit
                show_name: true
                show_state: true
                show_icon: false
                name: LIMIT
                styles:
                  card:
                    - background: transparent
                    - border: none
                    - border-right: 1px solid "#2a2a2a"
                    - border-radius: 0px
                    - padding: 14px 10px
                    - text-align: center
                  name:
                    - font-size: 10px
                    - letter-spacing: 0.12em
                    - color: '#888'
                    - text-transform: uppercase
                    - margin-bottom: 4px
                  state:
                    - font-size: 20px
                    - font-weight: 700
                    - color: >-
                        [[[ return (parseFloat(entity.state) || 0) > 0 ?
                        '#00803a' : '#555'; ]]]
              - type: custom:button-card
                entity: sensor.wallbox_temperatur
                show_name: true
                show_state: true
                show_icon: false
                name: TEMP
                styles:
                  card:
                    - background: transparent
                    - border: none
                    - border-radius: 0px
                    - padding: 14px 10px
                    - text-align: center
                  name:
                    - font-size: 10px
                    - letter-spacing: 0.12em
                    - color: '#888'
                    - text-transform: uppercase
                    - margin-bottom: 4px
                  state:
                    - font-size: 20px
                    - font-weight: 700
                    - color: |-
                        [[[ const t = parseFloat(entity.state) || 0;
                            if (t > 50) return '#cc3333';
                            if (t > 35) return '#cc8800';
                            return '#555'; ]]]
          - type: custom:stack-in-card
            mode: horizontal
            card_mod:
              style: |
                ha-card {
                  background: #0d0d0d !important;
                  border: 1px solid #2a2a2a !important;
                  border-radius: 16px !important;
                  overflow: hidden !important;
                }
            cards:
              - type: custom:button-card
                entity: sensor.wallbox_phasenstrom_l1
                show_name: true
                show_state: true
                show_icon: true
                name: L1
                icon: mdi:alpha-l-circle-outline
                styles:
                  card:
                    - background: transparent
                    - border: none
                    - border-right: 1px solid "#2a2a2a"
                    - border-radius: 0px
                    - padding: 14px 10px
                    - text-align: center
                  name:
                    - font-size: 10px
                    - color: '#888'
                    - letter-spacing: 0.12em
                    - text-transform: uppercase
                    - margin-bottom: 2px
                  state:
                    - font-size: 16px
                    - font-weight: 700
                    - color: '#e8f5f0'
                  icon:
                    - width: 24px
                    - color: >-
                        [[[ return (parseFloat(entity.state) || 0) > 0.5 ?
                        '#00e070' : '#333'; ]]]
                  img_cell:
                    - margin-bottom: 4px
                    - margin-right: 0px
              - type: custom:button-card
                entity: sensor.wallbox_phasenstrom_l2
                show_name: true
                show_state: true
                show_icon: true
                name: L2
                icon: mdi:alpha-l-circle-outline
                styles:
                  card:
                    - background: transparent
                    - border: none
                    - border-right: 1px solid "#2a2a2a"
                    - border-radius: 0px
                    - padding: 14px 10px
                    - text-align: center
                  name:
                    - font-size: 10px
                    - color: '#888'
                    - letter-spacing: 0.12em
                    - text-transform: uppercase
                    - margin-bottom: 2px
                  state:
                    - font-size: 16px
                    - font-weight: 700
                    - color: '#e8f5f0'
                  icon:
                    - width: 24px
                    - color: >-
                        [[[ return (parseFloat(entity.state) || 0) > 0.5 ?
                        '#00e070' : '#333'; ]]]
                  img_cell:
                    - margin-bottom: 4px
                    - margin-right: 0px
              - type: custom:button-card
                entity: sensor.wallbox_phasenstrom_l3
                show_name: true
                show_state: true
                show_icon: true
                name: L3
                icon: mdi:alpha-l-circle-outline
                styles:
                  card:
                    - background: transparent
                    - border: none
                    - border-radius: 0px
                    - padding: 14px 10px
                    - text-align: center
                  name:
                    - font-size: 10px
                    - color: '#888'
                    - letter-spacing: 0.12em
                    - text-transform: uppercase
                    - margin-bottom: 2px
                  state:
                    - font-size: 16px
                    - font-weight: 700
                    - color: '#e8f5f0'
                  icon:
                    - width: 24px
                    - color: >-
                        [[[ return (parseFloat(entity.state) || 0) > 0.5 ?
                        '#00e070' : '#333'; ]]]
                  img_cell:
                    - margin-bottom: 4px
                    - margin-right: 0px
          - type: custom:button-card
            entity: sensor.wallbox_phasenmodus
            show_name: true
            show_state: true
            show_icon: true
            name: PHASENMODUS
            styles:
              card:
                - background: '#0d0d0d'
                - border: 1px solid "#2a2a2a"
                - border-radius: 16px
                - padding: 14px 16px
                - text-align: center
              grid:
                - grid-template-areas: '"i" "n" "s"'
                - grid-template-columns: auto
                - justify-items: center
              name:
                - font-size: 10px
                - letter-spacing: 0.12em
                - color: '#888'
                - text-transform: uppercase
                - justify-self: center
                - margin-bottom: 4px
              state:
                - font-size: 16px
                - font-weight: 700
                - justify-self: center
              icon:
                - width: 24px
                - color: >-
                    [[[ return (entity.state === '3-phasig' || entity.state === '3_phase') ? '#4a9eff' :
                    '#00e070'; ]]]
              img_cell:
                - margin-bottom: 6px
                - margin-right: 0px
            state:
              - value: 3_phase
                icon: mdi:numeric-3-circle-outline
                styles:
                  state:
                    - color: '#4a9eff'
              - value: 3-phasig
                icon: mdi:numeric-3-circle-outline
                styles:
                  state:
                    - color: '#4a9eff'
              - value: 1_phase
                icon: mdi:numeric-1-circle-outline
                styles:
                  state:
                    - color: '#00e070'
              - value: 1-phasig
                icon: mdi:numeric-1-circle-outline
                styles:
                  state:
                    - color: '#00e070'
              - operator: default
                icon: mdi:numeric-1-circle-outline
                styles:
                  state:
                    - color: '#00e070'
          - type: custom:mini-graph-card
            entities:
              - entity: sensor.wallbox_ladeleistung
                name: Ladeleistung
            name: VERLAUF
            hours_to_show: 12
            points_per_hour: 6
            line_width: 2
            font_size: 65
            show:
              labels: false
              points: false
              legend: false
              name: true
              icon: false
              state: false
              fill: fade
              extrema: true
            hour24: true
            lower_bound: 0
            color: '#00803a'
            card_mod:
              style: |
                ha-card {
                  background: #0d0d0d !important;
                  border: 1px solid #2a2a2a !important;
                  border-radius: 16px !important;
                }
                .header .name {
                  font-size: 9px !important;
                  letter-spacing: 0.18em !important;
                  color: #2a2a2a !important;
                  text-transform: uppercase !important;
                }
                .extrema-container .value {
                  color: #444 !important;
                  font-size: 11px !important;
                }
          - type: custom:button-card
            entity: sensor.wallbox_ladezyklen_gesamt
            show_name: true
            show_state: true
            show_icon: true
            icon: mdi:counter
            name: Ladezyklen gesamt
            styles:
              card:
                - background: '#0d0d0d'
                - border: 1px solid "#2a2a2a"
                - border-radius: 16px
                - padding: 10px 16px
                - justify-content: flex-start
                - text-align: left
              grid:
                - grid-template-areas: '"i n s"'
                - grid-template-columns: min-content 1fr min-content
              name:
                - font-size: 10px
                - color: '#888'
                - letter-spacing: 0.12em
                - text-transform: uppercase
                - justify-self: start
              state:
                - font-size: 13px
                - font-weight: 700
                - color: '#888'
                - justify-self: end
              icon:
                - color: '#1e1e1e'
                - width: 16px
              img_cell:
                - margin-right: 8px
